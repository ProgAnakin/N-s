<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nós — a private keepsake for two." />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest. These three are how the same app
         gets a full-screen launch and a name under the icon there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nós" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Karla:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Nós</title>
    <script>
      // Applied before first paint so dark mode never flashes ivory.
      (function () {
        try {
          var stored = localStorage.getItem('nos.theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode — light is a fine default */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
